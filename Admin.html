<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Golden Hen Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#090909;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#111,#302500);
  padding:20px 15px;
  text-align:center;
  border-bottom:1px solid #d4af37;
}

header h1{
  color:#ffd700;
  font-size:24px;
}

header p{
  color:#aaa;
  margin-top:6px;
  font-size:13px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.login-box,
.panel{
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  margin-top:18px;
}

h2{
  color:#ffd700;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #444;
  background:#0d0d0d;
  color:#fff;
  outline:none;
  font-size:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.login-btn,
.approve{
  background:#ffd700;
  color:#000;
}

.reject{
  background:#c62828;
  color:#fff;
}

.refresh{
  background:#333;
  color:#fff;
}

.logout{
  background:#555;
  color:#fff;
}

.hidden{
  display:none!important;
}

.top-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  color:#ffd700;
  font-size:23px;
  margin-top:7px;
}

.card{
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.card.pending{
  border-color:#ffd700;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 0;
  border-bottom:1px solid #222;
}

.label{
  color:#999;
}

.value{
  color:#fff;
  text-align:right;
  word-break:break-word;
}

.amount{
  color:#00e676;
  font-size:20px;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  background:#333;
}

.status.pending{
  color:#ffd700;
}

.status.approved,
.status.paid{
  color:#00e676;
}

.status.rejected{
  color:#ff5252;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions button{
  flex:1;
}

.empty{
  text-align:center;
  color:#888;
  padding:30px 10px;
}

.info{
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:10px;
  padding:12px;
  color:#aaa;
  font-size:13px;
  margin-top:12px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #ffd700;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  display:none;
  z-index:9999;
  max-width:92%;
  text-align:center;
}

.loading{
  color:#ffd700;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .value{
    text-align:left;
  }

  .top-buttons{
    width:100%;
  }

  .top-buttons button{
    flex:1;
  }
}
</style>
</head>

<body>

<header>
  <h1>🐔 GOLDEN HEN ADMIN</h1>
  <p>Deposit • Withdraw • Users</p>
</header>

<div class="container">

<!-- =========================
     LOGIN
========================= -->

    LOGIN

  <div class="info">

  </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel" class="hidden">

  <!-- DASHBOARD -->

  <div class="panel">

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">

<div id="toast" class="toast"></div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

  signOut,

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  updateDoc,
  increment,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyD-uhTjZklnHdeOXMyR_gRiAWXyqIwAuFk",

  authDomain:
    "earn-app-8f00d.firebaseapp.com",

  projectId:
    "earn-app-8f00d",

  storageBucket:
    "earn-app-8f00d.firebasestorage.app",

  messagingSenderId:
    "864949482951",

  appId:
    "1:864949482951:web:1ce6dd7fe2b911ecea55e2",

  measurementId:
    "G-MBV2HQ0H49"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
  "bharamshills76@gmail.com";


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const box =
    document.getElementById("toast");

  box.innerText =
    message;

  box.style.display =
    "block";

  setTimeout(()=>{

    box.style.display =
      "none";

  },3500);
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   GET EMAIL
===================================================== */

function getEmail(data){

  return (
    data.Email ??
    data.email ??
    data.userEmail ??
    ""
  );
}


/* =====================================================
   GET AMOUNT
===================================================== */

function getAmount(data){

  const value =

    data.Amount ??
    data.amount ??
    data.Coin ??
    data.coin ??
    0;

  return Number(value) || 0;
}


/* =====================================================
   GET UID
   Supports uid / Uid / UID / userId
===================================================== */

function getUID(data){

  return (

    data.uid ??
    data.Uid ??
    data.UID ??
    data.userId ??
    data.userUID ??
    ""

  );
}


/* =====================================================
   GET NUMBER
===================================================== */

function getNumber(data){

  return (

    data.Num ??
    data.num ??
    data.Number ??
    data.number ??
    data.receiverNumber ??
    data.jazzCashNumber ??
    data.easypaisaNumber ??
    ""

  );
}


/* =====================================================
   GET METHOD
===================================================== */

function getMethod(data){

  return (

    data.Method ??
    data.method ??
    data.paymentMethod ??
    "JazzCash / EasyPaisa"

  );
}


/* =====================================================
   GET TRANSACTION ID
===================================================== */

function getTransactionID(data){

  return (

    data.TransactionID ??
    data.transactionID ??
    data.transactionId ??
    data.TID ??
    data.tid ??
    ""

  );
}


/* =====================================================
   GET STATUS
===================================================== */

function getStatus(data){

  return String(

    data.Status ??
    data.status ??
    "Pending"

  );
}


/* =====================================================
   GET DATE
===================================================== */

function getDate(data){

  const value =

    data.CreatedAt ??
    data.createdAt ??
    data.created_at ??
    data.approvedAt ??
    data.rejectedAt ??
    data.paidAt;

  if(!value){

    return "-";
  }

  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleString();

    }

    if(value.seconds){

      return new Date(
        value.seconds * 1000
      ).toLocaleString();

    }

    return new Date(
      value
    ).toLocaleString();

  }catch(error){

    return "-";
  }
}


/* =====================================================
   ADMIN LOGIN
===================================================== */

window.adminLogin =
async function(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;


  if(!email || !password){

    toast(
      "Email aur password enter karein"
    );

    return;
  }


  /* ADMIN EMAIL CHECK */

  if(
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    toast(
      "Sirf admin email allowed hai"
    );

    return;
  }


  try{

    toast("Login ho raha hai...");


    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    toast(
      "Login failed: " +
      (
        error.code ||
        error.message
      )
    );

  }

};


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async(user)=>{

    console.log(
      "AUTH USER:",
      user
    );


    if(

      user &&

      user.email &&

      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()

    ){

      document
        .getElementById("loginBox")
        .classList
        .add("hidden");


      document
        .getElementById("adminPanel")
        .classList
        .remove("hidden");


      toast(
        "Admin login successful"
      );


      await loadAll();

    }

    else{

      if(user){

        await signOut(auth);

        toast(
          "Sirf admin account allowed hai"
        );

      }


      document
        .getElementById("loginBox")
        .classList
        .remove("hidden");


      document
        .getElementById("adminPanel")
        .classList
        .add("hidden");

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

window.adminLogout =
async function(){

  try{

    await signOut(auth);

    toast(
      "Logged out"
    );

  }catch(error){

    toast(
      "Logout failed"
    );

  }

};


/* =====================================================
   LOAD ALL
===================================================== */

window.loadAll =
async function(){

  toast(
    "Data loading..."
  );


  /*
    Teeno Firebase requests
    ek saath load hongi.
  */

  await Promise.allSettled([

    loadDeposits(),

    loadWithdrawals(),

    loadUsers()

  ]);

};


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits(){

  const box =
    document.getElementById(
      "depositList"
    );


  box.innerHTML =
    '<div class="empty loading">Loading deposits...</div>';


  try{

    console.log(
      "Loading depositRequests..."
    );


    const snap =
      await getDocs(
        collection(
          db,
          "depositRequests"
        )
      );


    console.log(
      "Deposit documents:",
      snap.size
    );


    document.getElementById(
      "depositCount"
    ).innerText =
      snap.size;


    if(snap.empty){

      box.innerHTML =
        '<div class="empty">No deposit requests found</div>';

      return;
    }


    const items = [];


    snap.forEach(
      (documentSnapshot)=>{

        items.push({

          id:
            documentSnapshot.id,

          ...documentSnapshot.data()

        });

      }
    );


    items.reverse();


    box.innerHTML =
      "";


    items.forEach(
      (item)=>{

        const amount =
          getAmount(item);

        const uid =
          getUID(item);

        const email =
          getEmail(item);

        const number =
          getNumber(item);

        const method =
          getMethod(item);

        const transaction =
          getTransactionID(item);

        const status =
          getStatus(item);

        const statusLower =
          status.toLowerCase();


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card " +
          (
            statusLower ===
            "pending"
            ? "pending"
            : ""
          );


        card.innerHTML = `

          <div class="row">
            <span class="label">
              Amount
            </span>

            <span class="value amount">
              Rs. ${amount}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Email
            </span>

            <span class="value">
              ${escapeHTML(email)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              UID
            </span>

            <span class="value">
              ${escapeHTML(uid)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Transaction ID
            </span>

            <span class="value">
              ${escapeHTML(transaction)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Number
            </span>

            <span class="value">
              ${escapeHTML(number)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Method
            </span>

            <span class="value">
              ${escapeHTML(method)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Date
            </span>

            <span class="value">
              ${escapeHTML(getDate(item))}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Status
            </span>

            <span class="value">
              <span class="status ${escapeHTML(statusLower)}">
                ${escapeHTML(status)}
              </span>
            </span>
          </div>

        `;


        /* APPROVE + REJECT */

        if(
          statusLower ===
          "pending"
        ){

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "actions";


          const approve =
            document.createElement(
              "button"
            );

          approve.className =
            "approve";

          approve.innerText =
            "✅ APPROVE";


          approve.onclick =
            function(){

              approveDeposit(
                item.id
              );

            };


          const reject =
            document.createElement(
              "button"
            );

          reject.className =
            "reject";

          reject.innerText =
            "❌ REJECT";


          reject.onclick =
            function(){

              rejectDeposit(
                item.id
              );

            };


          actions.appendChild(
            approve
          );

          actions.appendChild(
            reject
          );

          card.appendChild(
            actions
          );

        }


        box.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(
      "DEPOSIT LOAD ERROR:",
      error
    );


    box.innerHTML = `
      <div class="empty">
        ❌ Error loading deposits<br><br>
        ${escapeHTML(
          error.code ||
          error.message
        )}
      </div>
    `;


    toast(
      "Deposits error: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(
  requestId
){

  const ok =
    confirm(
      "Is deposit ko approve karna hai?"
    );


  if(!ok){

    return;
  }


  try{

    toast(
      "Deposit checking..."
    );


    const requestRef =
      doc(
        db,
        "depositRequests",
        requestId
      );


    const requestSnap =
      await getDoc(
        requestRef
      );


    if(!requestSnap.exists()){

      toast(
        "Deposit request nahi mili"
      );

      return;
    }


    const data =
      requestSnap.data();


    const uid =
      getUID(data);

    const amount =
      getAmount(data);

    const status =
      getStatus(data);


    if(!uid){

      toast(
        "❌ UID missing hai"
      );

      return;
    }


    if(amount <= 0){

      toast(
        "❌ Amount invalid hai"
      );

      return;
    }


    if(
      status.toLowerCase() !==
      "pending"
    ){

      toast(
        "Ye request already processed hai"
      );

      return;
    }


    /* USER DOCUMENT */

    const userRef =
      doc(
        db,
        "user",
        uid
      );


    const userSnap =
      await getDoc(
        userRef
      );


    if(!userSnap.exists()){

      toast(
        "❌ User document nahi mila: " +
        uid
      );

      return;
    }


    /* BATCH */

    const batch =
      writeBatch(db);


    /*
      BALANCE MEIN DEPOSIT
    */

    batch.update(
      userRef,
      {

        Coin:
          increment(amount),

        "Total earning":
          increment(amount)

      }
    );


    /*
      REQUEST APPROVED
    */

    batch.update(
      requestRef,
      {

        Status:
          "Approved",

        status:
          "Approved",

        approvedAt:
          serverTimestamp(),

        approvedBy:
          ADMIN_EMAIL

      }
    );


    await batch.commit();


    toast(
      "✅ Approved! Rs. " +
      amount +
      " balance mein add ho gaya."
    );


    await loadAll();

  }catch(error){

    console.error(
      "APPROVE ERROR:",
      error
    );


    toast(
      "❌ Approve failed: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   REJECT DEPOSIT
===================================================== */

async function rejectDeposit(
  requestId
){

  const ok =
    confirm(
      "Is deposit ko reject karna hai?"
    );


  if(!ok){

    return;
  }


  try{

    const ref =
      doc(
        db,
        "depositRequests",
        requestId
      );


    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      toast(
        "Request nahi mili"
      );

      return;
    }


    const data =
      snap.data();


    if(
      getStatus(data)
        .toLowerCase() !==
      "pending"
    ){

      toast(
        "Already processed"
      );

      return;
    }


    await updateDoc(
      ref,
      {

        Status:
          "Rejected",

        status:
          "Rejected",

        rejectedAt:
          serverTimestamp(),

        rejectedBy:
          ADMIN_EMAIL

      }
    );


    toast(
      "❌ Deposit rejected"
    );


    await loadDeposits();

  }catch(error){

    console.error(
      "REJECT ERROR:",
      error
    );


    toast(
      "Reject failed: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   LOAD WITHDRAWALS
===================================================== */

    );


  box.innerHTML =
    '<div class="empty loading">Loading withdrawals...</div>';

    if(snap.empty){

      box.innerHTML =

    }


    const items = [];


    snap.forEach(
      (documentSnapshot)=>{

        items.push({

          id:
            documentSnapshot.id,

          ...documentSnapshot.data()

        });

      }
    );


    items.reverse();


    box.innerHTML =
      "";


    items.forEach(
      (item)=>{

        const amount =
          getAmount(item);

        const uid =
          getUID(item);

        const email =
          getEmail(item);

        const number =
          getNumber(item);

        const method =
          getMethod(item);

        const status =
          getStatus(item);

        const statusLower =
          status.toLowerCase();


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card " +
          (
            statusLower ===
            "pending"
            ? "pending"
            : ""
          );


        card.innerHTML = `

          <div class="row">
            <span class="label">
              Amount
            </span>

            <span class="value amount">
              Rs. ${amount}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Email
            </span>

            <span class="value">
              ${escapeHTML(email)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              UID
            </span>

            <span class="value">
              ${escapeHTML(uid)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Number
            </span>

            <span class="value">
              ${escapeHTML(number)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Method
            </span>

            <span class="value">
              ${escapeHTML(method)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Date
            </span>

            <span class="value">
              ${escapeHTML(getDate(item))}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Status
            </span>

            <span class="value">
              <span class="status ${escapeHTML(statusLower)}">
                ${escapeHTML(status)}
              </span>
            </span>
          </div>

        `;


        if(
          statusLower ===
          "pending"
        ){

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "actions";


          const paid =
            document.createElement(
              "button"
            );

          paid.className =
            "approve";

          paid.innerText =
            "✅ MARK PAID";


          paid.onclick =
            function(){

              approveWithdrawal(
                item.id
              );

            };


          const reject =
            document.createElement(
              "button"
            );

          reject.className =
            "reject";

          reject.innerText =
            "❌ REJECT";


          reject.onclick =
            function(){

              rejectWithdrawal(
                item.id
              );

            };


          actions.appendChild(
            paid
          );

          actions.appendChild(
            reject
          );


          card.appendChild(
            actions
          );

        }


        box.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(
      "WITHDRAW LOAD ERROR:",
      error
    );


    box.innerHTML = `
      <div class="empty">
        ❌ Error loading withdrawals<br><br>
        ${escapeHTML(
          error.code ||
          error.message
        )}
      </div>
    `;


    toast(
      "Withdrawals error: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   MARK WITHDRAWAL PAID
===================================================== */

async function approveWithdrawal(
  requestId
){

  const ok =
    confirm(
      "Withdrawal ko MARK PAID karna hai?"
    );


  if(!ok){

    return;
  }


  try{

    const ref =
      doc(
        db,
        "withdrawalRequests",
        requestId
      );


    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      toast(
        "Withdrawal request nahi mili"
      );

      return;
    }


    const data =
      snap.data();


    if(
      getStatus(data)
        .toLowerCase() !==
      "pending"
    ){

      toast(
        "Already processed"
      );

      return;
    }


    await updateDoc(
      ref,
      {

        Status:
          "Paid",

        status:
          "Paid",

        paidAt:
          serverTimestamp(),

        paidBy:
          ADMIN_EMAIL

      }
    );


    toast(
      "✅ Withdrawal marked as PAID"
    );


    await loadWithdrawals();

  }catch(error){

    console.error(
      "WITHDRAW ERROR:",
      error
    );


    toast(
      "Payment update failed: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   REJECT WITHDRAWAL
===================================================== */

async function rejectWithdrawal(
  requestId
){

  const ok =
    confirm(
      "Withdrawal reject karna hai?"
    );


  if(!ok){

    return;
  }


  try{

    const ref =
      doc(
        db,
        "withdrawalRequests",
        requestId
      );


    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      toast(
        "Withdrawal nahi mili"
      );

      return;
    }


    const data =
      snap.data();


    if(
      getStatus(data)
        .toLowerCase() !==
      "pending"
    ){

      toast(
        "Already processed"
      );

      return;
    }


    await updateDoc(
      ref,
      {

        Status:
          "Rejected",

        status:
          "Rejected",

        rejectedAt:
          serverTimestamp(),

        rejectedBy:

      }

    toast(

    );


    await loadWithdrawals();

  }catch(error){

    console.error(
      "WITHDRAW REJECT ERROR:",
      error
    );


    toast(
      "Reject failed: " +
      (
        error.code ||
        error.message
      )
    );

  }

}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

  const box =
    document.getElementById(
      "userList"
    );


  box.innerHTML =
    '<div class="empty loading">Loading users...</div>';


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "user"
        )
      );


    document.getElementById(
      "userCount"
    ).innerText =
      snap.size;


    if(snap.empty){

      box.innerHTML =
        '<div class="empty">No users found</div>';

      return;
    }


    box.innerHTML =
      "";


    snap.forEach(
      (documentSnapshot)=>{

        const data =
          documentSnapshot.data();


        const email =
          getEmail(data) ||
          "No email";


        const coin =
          Number(
            data.Coin ??
            data.coin ??
            0
          );


        const hens =
          Number(
            data.hens ??
            data.Hens ??
            0
          );


        const eggs =
          Number(
            data.eggs ??
            data.Eggs ??
            0
          );


        const total =
          Number(

            data["Total earning"] ??
            data.totalEarned ??
            data.totalEarning ??
            0

          );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card";


        card.innerHTML = `

          <div class="row">
            <span class="label">
              Email
            </span>

            <span class="value">
              ${escapeHTML(email)}
            </span>
          </div>

          <div class="row">
            <span class="label">
              UID
            </span>

            <span class="value">
              ${escapeHTML(
                documentSnapshot.id
              )}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Balance
            </span>

            <span class="value amount">
              Rs. ${coin}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Hens
            </span>

            <span class="value">
              ${hens}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Eggs
            </span>

            <span class="value">
              ${eggs}
            </span>
          </div>

          <div class="row">
            <span class="label">
              Total Earning
            </span>

            <span class="value">
              Rs. ${total}
            </span>
          </div>

        `;


        box.appendChild(
          card
        );

      }
    );


  }catch(error){

    console.error(
      "USER LOAD ERROR:",
      error
    );


    box.innerHTML = `
      <div class="empty">
        ❌ Error loading users<br><br>
        ${escapeHTML(
          error.code ||
          error.message
        )}
      </div>
    `;


    toast(
      "Users error: " +
      (
        error.code ||
        error.message
      )
    );

  }

}

</script>
